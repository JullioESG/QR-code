<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | QR code component</title>
  <style>
      body {
          background-color: hsl(212, 45%, 89%);
          font-size: 15px;
          font-family: "Outfit", sans-serif;
          font-weight: 700;
        }
      .centro {
        position: relative;
        display: inline-block;
        align-items: center; 
      }
      .centro img {
        width: 100%;
        height: auto;
        border-radius: 10px;
        margin-bottom: 24px;
      }
      .quadrado {
        padding: 16px;
        border: 4px solid white;
        justify-content: center;
        width: 320px;
        background-color: white;
        border-radius: 20px;
        box-sizing: border-box; 
        height: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .align-centro {
        display: flex;
        justify-content: center;
        align-items: center;
        transform: translate(-50%, -50%);
        top: 50%;
        left: 50%;
        position: absolute;
      }
      .attribution2 {
       font-size: 22px;
       color: hsl(218, 44%, 22%);
       font-weight: 700;
       margin: 0 0 16px 0;
       padding: 0 8px;
      }
      .attribution3 {
        font-size: 15px;
        color: hsl(220, 15%, 55%);
        font-weight: 400;
        margin: 0 0 12px 0;
        padding: 0 12px;
        line-height: 1.4;
      }
  </style>
  
</head>
<body>
  <div class="align-centro">
    <main class="centro">
    <div class="quadrado">
      <img src="images/image-qr-code.png" alt="Ícone">
      <div class="attribution2">Improve your front-end skills by building projects</div>
      <br>
      <div class="attribution3">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</div>
    </div>
    </main>
  </div>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://www.frontendmentor.io/profile/JullioESG">Jullio Gimenez</a>.
  </footer>
</body>
</html>
